name: Deploy Go Application

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build, Test, and Deploy Go Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Go Environment
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Cache Go Modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Dependencies
        run: go mod download

      - name: Run GolangCI-Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Run Unit Tests with Coverage
        run: |
          go test ./... -v -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: true

      - name: Install and Run GoSec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $HOME/go/bin/gosec ./... || true
        continue-on-error: true

      - name: Install and Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $HOME/go/bin/govulncheck ./... || true
        continue-on-error: true

      - name: Build Go Binary
        run: |
          mkdir -p ./bin
          go build -v -o ./bin/app ./cmd/

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-binary
          path: ./bin/app

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: jayeshkhairnar-git
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/jayeshkhairnar-git/go-app:${{ github.sha }}
            ghcr.io/jayeshkhairnar-git/go-app:latest

