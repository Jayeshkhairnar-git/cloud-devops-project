name: Deploy Dcker Image to Cloud_Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: read

    steps:

    - name: Checkout repository
      uses: actions/checkout@v4


    - name: Google Auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/70756149774/locations/global/workloadIdentityPools/github-actions/providers/github-repos'
        service_account: 'ws25-student@hs-heilbronn-devsecops.iam.gserviceaccount.com'


    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet


    - name: Build Docker image
      run: |
        IMAGE="europe-west1-docker.pkg.dev/hs-heilbronn-devsecops/student-images/ws25-cloudcommanders-acetlisto:latest"
        docker build -t $IMAGE .


    - name: Push Docker image
      run: |
        IMAGE="europe-west1-docker.pkg.dev/hs-heilbronn-devsecops/student-images/ws25-cloudcommanders-acetlisto:latest"
        docker push $IMAGE


    - name: Deploy to Cloud Run
      uses: google-github-actions/deploy-cloudrun@v2
      with:
        service: "ws25-cloudcommanders-acetlisto"
        image: "europe-west1-docker.pkg.dev/hs-heilbronn-devsecops/student-images/ws25-cloudcommanders-acetlisto:latest"
        region: "europe-west1"
